[package]
name = "memento"
version = "0.1.0"
edition = "2021"
description = "memneto - Long-term memory storage for AI agents via MCP"
license = "MIT"
authors = ["Kevin Xu"]
repository = "https://github.com/pchaganti/memento"
homepage = "https://github.com/pchaganti/memento"
readme = "README.md"
keywords = ["ai", "memory", "mcp", "agent", "llm"]
categories = ["development-tools", "database"]

[[bin]]
name = "memento"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "json"] }
tokio = { version = "1.35", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono", "uuid"] }
# Note: We use sqlx for both SQLite and PostgreSQL with connection pooling for thread-safety
# sqlx 0.8 required for pgvector 0.4 sqlx feature support

# Vector search
pgvector = { version = "0.4", features = ["sqlx"] }

# Embeddings
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"
sha2 = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
dotenv = "0.15"
config = "0.14"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"

# MCP - using JSON-RPC for now (full MCP SDK would need to be implemented)

# CLI
clap = { version = "4.4", features = ["derive"] }
dialoguer = "0.11"
atty = "0.2"
directories = "5"

[dev-dependencies]
tokio-test = "0.4"

