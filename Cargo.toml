[package]
name = "memento"
version = "0.1.0"
edition = "2021"
description = "memento - Universal Agent Memory Engine memory service for AI agents"
license = "MIT"
authors = ["Kevin Xu"]

[[bin]]
name = "memento"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "json"] }
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono", "uuid"] }
rusqlite = { version = "0.30", features = ["bundled"] }

# Vector search
pgvector = "0.2"

# Embeddings
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
dotenv = "0.15"
config = "0.14"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"

# MCP - using JSON-RPC for now (full MCP SDK would need to be implemented)

# CLI
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"

